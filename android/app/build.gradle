plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.hajarapp.vibevault"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.hajarapp.vibevault"
        // Minimum SDK 21 keeps 99%+ device coverage and is required by google_mobile_ads
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug   // swap for a real keystore before production
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'androidx.multidex:multidex:2.0.1'
}

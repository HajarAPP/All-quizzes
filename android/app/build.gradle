plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Flutter Gradle Plugin — must come after Android + Kotlin plugins.
    // Version and classpath are resolved via settings.gradle pluginManagement.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.hajarapp.vibevault"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.hajarapp.vibevault"
        // minSdk 21 = 99%+ device coverage; required by google_mobile_ads
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
        multiDexEnabled true
    }

    buildTypes {
        release {
            // Using debug signing for CI. Add a real keystore for Play Store uploads.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
    implementation "androidx.multidex:multidex:2.0.1"
}

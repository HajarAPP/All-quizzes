allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Force namespace + compileSdk on EVERY Android library (nb_utils, fluttertoast, etc.)
    plugins.withType(com.android.build.gradle.LibraryPlugin) {
        android {
            if (namespace == null || namespace.isEmpty()) {
                namespace project.group ?: project.name.replace("-", ".")
            }
            compileSdk 34
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    plugins.withType(com.android.build.gradle.AppPlugin) {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

// Force ALL subprojects (fluttertoast, nb_utils, etc.) to Java 17
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

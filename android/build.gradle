allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // ── Force namespace + compileSdk on EVERY Android library (nb_utils, etc.) ──
    plugins.withType(com.android.build.gradle.LibraryPlugin) {
        android {
            if (namespace == null || namespace.isEmpty()) {
                namespace project.group ?: project.name.replace("-", ".")
            }
            compileSdk 34
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    plugins.withType(com.android.build.gradle.AppPlugin) {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    // ── ABSOLUTE FORCE: afterEvaluate ensures we override LAST ──
    afterEvaluate {
        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
            options.release.set(17)
        }
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }

    // ── Pin AGP version across all subprojects ──
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion '8.7.3'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

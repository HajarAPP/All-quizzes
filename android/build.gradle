allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Force namespace on old plugins (nb_utils, etc.) that don't define one.
// This MUST be a separate block from the one with evaluationDependsOn
// to avoid "Cannot run afterEvaluate when project is already evaluated".
subprojects {
    plugins.withType(com.android.build.gradle.LibraryPlugin) {
        android {
            if (namespace == null) {
                namespace project.group.toString()
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

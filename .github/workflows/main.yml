name: 🏗️ Build & Upload SecurityPlus APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Flutter version
        run: flutter --version

      # CRITICAL: local.properties must exist BEFORE pub get and build
      - name: 📝 Write local.properties
        run: |
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecurityPlus-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

name: 🏗️ Build & Upload SecurityPlus APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Flutter & Java version
        run: |
          flutter --version
          java -version

      - name: 📝 Write local.properties
        run: |
          FLUTTER_SDK="$(which flutter | xargs dirname | xargs dirname)"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 🧹 Force Clean and Repair
        run: |
          flutter clean
          flutter pub cache repair
          flutter pub get

      - name: 📦 Upgrade dependencies
        run: flutter pub upgrade

      - name: 🏗️ Build APK with Ignore Flags
        run: flutter build apk --release --no-tree-shake-icons --ignore-deprecation

      - name: 📋 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SecurityPlus-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

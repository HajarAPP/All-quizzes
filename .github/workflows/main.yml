name: 🏗️ Build & Upload SecurityPlus APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Flutter & Java version
        run: |
          flutter --version
          java -version

      - name: 📝 Write local.properties
        run: |
          FLUTTER_SDK="$(which flutter | xargs dirname | xargs dirname)"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🧹 Clean before build
        run: flutter clean && flutter pub get

      - name: 🏗️ Build Release APK
        id: build
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log
        continue-on-error: true

      - name: 📋 Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: ❌ Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "============================================"
          echo "BUILD FAILED — Full log captured as artifact"
          echo "============================================"
          tail -50 build_output.log
          exit 1

      - name: 📤 Upload APK Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SecurityPlus-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
